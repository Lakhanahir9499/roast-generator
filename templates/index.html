<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Roast Generator</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen">
  <div class="p-6 bg-gray-800 rounded-xl w-full max-w-md">
    <h1 class="text-2xl font-bold mb-4 text-center">Desi Roast Generator</h1>

    <label class="block mb-2">Naam:</label>
    <input id="name" class="w-full mb-4 p-2 rounded bg-gray-700 text-white" placeholder="Naam daalo..." />

    <label class="block mb-2">Mood:</label>
    <select id="mood" class="w-full mb-4 p-2 rounded bg-gray-700 text-white">
      <option value="friendly">Friendly</option>
      <option value="savage">Savage</option>
      <option value="brutal">Brutal</option>
    </select>

    <button onclick="generateRoast()" class="bg-red-600 hover:bg-red-700 w-full py-2 rounded font-bold">Roast Banao</button>

    <div id="result" class="mt-4 text-yellow-400 font-semibold"></div>
    <audio id="audio" class="mt-4 w-full" controls hidden></audio>
    <button onclick="saveMeme()" class="mt-4 bg-green-600 hover:bg-green-700 w-full py-2 rounded font-bold">Meme Image Save Karo</button>
    <div id="meme" class="mt-4 p-4 bg-gray-700 rounded text-center text-white"></div>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
